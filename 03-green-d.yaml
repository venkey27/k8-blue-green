apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-green
  labels:
    version: green
    app: nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      version: green
      app: nginx
  # Pod
  template:
    metadata:
      labels:
        version: green
        app: nginx
    spec:
      containers:
      - name: nginx
        image: venkey57/blue-green:0.2.0
        imagePullPolicy: Always    # always means, pull the image always when code changes
        ports: # generally node pulls the image once, when same node pulls 2nd time it wont pull all the code, so we nee to specify imagePullPolicy
        - containerPort: 80
---